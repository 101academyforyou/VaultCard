# 在 GitHub 的雲端 Mac 上打包 iOS App，並上傳到 App Store Connect（TestFlight）
# 使用方式：Actions → 「iOS 打包上傳 TestFlight」→ Run workflow
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   APPLE_TEAM_ID   Apple 開發者團隊 ID（10 碼）
#   ASC_KEY_ID      App Store Connect API 金鑰 ID
#   ASC_ISSUER_ID   App Store Connect API Issuer ID
#   ASC_KEY_P8      API 金鑰 .p8 檔的完整內容（含 BEGIN / END 兩行）
name: iOS 打包上傳 TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本號（App Store 上顯示的版本，例如 1.0.0）
        required: true
        default: '1.0.0'

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # 建置號碼每次自動 +1（App Store Connect 要求每次上傳都不同）
      BUILD_NUMBER: ${{ github.run_number }}
      MARKETING_VERSION: ${{ inputs.version }}
    steps:
      - name: 檢查 Secrets 是否都已設定
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets：$missing。請到 Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件並同步網頁檔案到 iOS 專案
        run: |
          npm ci
          node scripts/build-www.mjs
          npx cap sync ios

      - name: 準備 App Store Connect API 金鑰
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # 先打包「不簽署」的版本：開發用描述檔需要註冊測試裝置，這裡用不到。
      # 簽署交給下一步匯出時，用 App Store 發佈憑證自動處理（不需要任何裝置）。
      - name: 打包（Archive）
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION"

      - name: 簽署並上傳到 App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### ✅ 已上傳版本 $MARKETING_VERSION（建置 $BUILD_NUMBER）" >> "$GITHUB_STEP_SUMMARY"
          echo "約 15–30 分鐘後會出現在 App Store Connect → TestFlight。" >> "$GITHUB_STEP_SUMMARY"

      - name: 刪除金鑰檔
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
